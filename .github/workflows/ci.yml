name: CI

# R-04: single source of truth for "is this build shippable?"
#   * static  - Python validators / asset audit / capsule / wiki (no engine)
#   * godot   - pinned Godot 4.6.1, in-engine smoke + real Linux/X11 export
#   * windows - pinned Godot 4.6.1, in-engine smoke + real Windows export,
#               then launches the exported .exe in smoke mode (the ship target)
# Any failing step blocks the workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.1-stable
  GODOT_STATUS: stable

jobs:
  static:
    name: Static verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Static gate
        env:
          COHERONIA_COMMIT: ${{ github.sha }}
        run: python scripts/ci/verify.py --static-only

  godot:
    name: Smoke + export (Godot 4.6.1)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_BASE: https://github.com/godotengine/godot-builds/releases/download
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install runtime libraries
        # Bound + retry apt so a stalled Azure mirror fails fast and self-heals
        # instead of hanging the runner for the full timeout (a prior run wedged
        # ~30 min on apt-get update and never reached Godot). Per-connection
        # timeouts + forced IPv4 + up to three attempts; the final dpkg check fails
        # the step if the packages never landed.
        timeout-minutes: 8
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true"
          for i in 1 2 3; do
            sudo apt-get $APT_OPTS update && break
            echo "apt-get update attempt $i failed; retrying in 10s"; sleep 10
          done
          for i in 1 2 3; do
            sudo apt-get $APT_OPTS install -y --no-install-recommends \
              xvfb libgl1 libglu1-mesa libxi6 libxrandr2 libxcursor1 \
              libxinerama1 libasound2t64 libpulse0 fontconfig unzip && break
            echo "apt-get install attempt $i failed; retrying in 10s"; sleep 10
          done
          dpkg -s xvfb >/dev/null 2>&1 || { echo "runtime libraries missing after retries"; exit 1; }

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          curl -fL -o godot.zip \
            "$GODOT_BASE/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          set -euo pipefail
          curl -fL -o templates.tpz \
            "$GODOT_BASE/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION%%-*}.${GODOT_STATUS}"
          mkdir -p "$DEST"
          mv templates/* "$DEST/"
          ls "$DEST" | head

      - name: Import project resources
        run: xvfb-run -a godot --headless --path . --import

      - name: Smoke + export + run exported artifact
        # Finite bound so a future hang fails the step instead of hanging the
        # runner. The verifier runs the source smoke, exports Linux/X11, then
        # launches the exported artifact in smoke mode (separate results file).
        timeout-minutes: 20
        env:
          COHERONIA_COMMIT: ${{ github.sha }}
          # The Linux/X11 runner has a deterministic shutdown leak. Preserve
          # the exact leaked instance/resource names in the job log so the
          # fail-closed lifecycle gate is actionable instead of opaque.
          COHERONIA_GODOT_VERBOSE: "1"
        run: |
          xvfb-run -a python scripts/ci/verify.py \
            --godot godot --export --export-preset "Linux/X11"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coheronia-linux-${{ github.sha }}
          path: |
            build/coheronia
            build/coheronia.pck
            build/source_smoke_results.json
            build/export_smoke_results.json
            build/build_info.json
          if-no-files-found: warn

  windows:
    name: Smoke + export (Windows 4.6.1 — ship target)
    needs: static
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GODOT_BASE: https://github.com/godotengine/godot-builds/releases/download
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Godot ${{ env.GODOT_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "$env:GODOT_BASE/$env:GODOT_VERSION/Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot-bin -Force
          # Prefer the console-subsystem build so the verifier can tee stdout and
          # scan it for SCRIPT ERROR / Compile Error markers (the GUI-subsystem
          # exe does not attach to the parent console on Windows).
          $exe = Get-ChildItem godot-bin -Recurse -Filter *_console.exe | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem godot-bin -Recurse -Filter *.exe | Select-Object -First 1 }
          "GODOT_BIN=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe.FullName --version

      - name: Install export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "$env:GODOT_BASE/$env:GODOT_VERSION/Godot_v$($env:GODOT_VERSION)_export_templates.tpz"
          Invoke-WebRequest -Uri $url -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath templates-extract -Force
          $dest = Join-Path $env:APPDATA "Godot\export_templates\4.6.1.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item "templates-extract\templates\*" $dest -Force
          Get-ChildItem $dest | Select-Object -First 5 Name

      - name: Import project resources
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path . --import

      - name: Smoke + export + run exported artifact
        # The verifier runs the windowed source smoke (windows-latest provides a
        # desktop session; Godot falls back to the OpenGL3 renderer without a GPU),
        # exports the Windows Desktop preset, then launches coheronia.exe in smoke
        # mode against a separate results file — verifying the actual ship target.
        shell: pwsh
        timeout-minutes: 30
        env:
          COHERONIA_COMMIT: ${{ github.sha }}
        run: python scripts/ci/verify.py --godot $env:GODOT_BIN --export --export-preset "Windows Desktop"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coheronia-windows-${{ github.sha }}
          path: |
            build/coheronia.exe
            build/coheronia.pck
            build/source_smoke_results.json
            build/export_smoke_results.json
            build/build_info.json
          if-no-files-found: warn
